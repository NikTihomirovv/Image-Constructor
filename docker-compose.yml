services:
  image-constructor:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-constructor:latest
    container_name: image-constructor
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./service/resources:/app/resources:ro
      - ./service/fonts:/app/fonts:ro
      - ./service/output:/app/output
      - ./service/config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s